[package]
name = "allstops-cli"
description = "Command-line interface for allstops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "allstops"
path = "src/main.rs"

[dependencies]
allstops-gtfs = { workspace = true, features = ["network"] }
allstops-core.workspace = true
allstops-verify.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
chrono = { workspace = true, features = ["clock"] }
ureq = "3.4"
toml_edit = "0.25"
rayon = "1.12"
chrono-tz.workspace = true
