[package]
name = "allstops-gtfs"
description = "GTFS loading with input limits, service calendars, station clustering and selection for allstops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
allstops-core = { workspace = true, optional = true }
csv.workspace = true
zip.workspace = true
serde.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
memchr = "2"
postcard.workspace = true
flate2.workspace = true
sha2.workspace = true


[features]
default = ["network"]
# Building routing networks for the solver. The verifier turns this off so
# it cannot link the solver crate.
network = ["dep:allstops-core"]

[dev-dependencies]
proptest.workspace = true
toml.workspace = true
