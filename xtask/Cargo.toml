[package]
name = "xtask"
description = "Benchmark harness, synthetic network generator and project helpers for allstops"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
allstops-gtfs = { workspace = true, features = ["network"] }
allstops-core.workspace = true
allstops-verify.workspace = true
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Only for the GTFS loader comparison in `cargo xtask parse`.
gtfs-structures = { version = "0.50.1", default-features = false }
libc = "0.2"
# Only for the pack format comparison in `cargo xtask pack`.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
rkyv = "0.8.18"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
