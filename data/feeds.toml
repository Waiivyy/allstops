# Registered GTFS feeds. `allstops fetch <id>` downloads the URL over HTTPS and
# refuses to continue if the SHA-256 differs from `sha256`, unless run with
# --accept-new-hash, which updates `sha256` and `retrieved`.
#
# `attribution` is a template: {retrieved} and {feed_version} are filled in
# from this file and from feed_info.txt wherever the text is shown.

[[feed]]
id = "mvv"
name = "MVV Munich, whole network (GTFS-MVV-Gesamt)"
url = "https://www.mvv-muenchen.de/fileadmin/mediapool/developer/opendata/gesamt_gtfs.zip"
homepage = "https://www.mvv-muenchen.de/fahrplanauskunft/fuer-entwickler/opendata/index.html"
# The publisher states "Creative Commons Attribution License (cc-by)" and links
# to the Open Definition CC-BY page; no licence version is named.
licence = "CC BY (version not stated by the publisher)"
licence_url = "https://opendefinition.org/licenses/cc-by/"
attribution = "Timetable data: Münchner Verkehrs- und Tarifverbund GmbH (MVV), CC BY, retrieved {retrieved}, feed version {feed_version}"
redistribution = "allowed with attribution"
sha256 = "13e9b6db7681c3849f57bc8afb97c3182b9994dbb512dd6d242af0fe6961b21c"
retrieved = "2026-10-06"
