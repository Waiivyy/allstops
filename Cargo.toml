[workspace]
resolver = "3"
members = [
    "crates/allstops-gtfs",
    "crates/allstops-core",
    "crates/allstops-verify",
    "crates/allstops-cli",
    "xtask",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Waiivyy/allstops"
authors = ["Waiivyy"]

[workspace.dependencies]
allstops-gtfs = { path = "crates/allstops-gtfs" }
allstops-core = { path = "crates/allstops-core" }
allstops-verify = { path = "crates/allstops-verify" }
csv = "1.4"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
rand = { version = "0.10", default-features = false }
rand_chacha = "0.10"
proptest = "1.11"

[profile.release]
debug = 1

[profile.bench]
debug = 1
